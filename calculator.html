<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
<title>넘기기 작업 계산기 (V3.1 키패드수정)</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* -------------------- 전역 스타일 -------------------- */
html, body {
    margin:0; padding:0; height:100%;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#1a1a2e; color:#fff;
    overflow: hidden; /* 스크롤 방지 */
}
*, *::before, *::after { box-sizing: border-box; }

h1{
    position: relative;
    text-align:center; margin:0; padding:15px; font-size:28px;
    color:#f0f0f0; background:#1a1a2e;
    height: 70px;
    border-bottom: 2px solid #252540;
}
#version-display {
    position: absolute; top: 12px; right: 20px;
    font-size: 14px; font-weight: 500; color: #888;
}

.content-wrapper {
    position: absolute; top:70px; left:0; right:0; bottom:0;
    overflow: hidden; padding: 10px;
    display:flex; flex-direction:column;
}

/* -------------------- 메인 레이아웃 (3단 분할 강제) -------------------- */
.top-area {
    display: flex; 
    justify-content: space-between; 
    gap: 8px; 
    width: 100%;
    height: 65%; /* 전체 높이의 65% 차지 */
    min-height: 500px;
}

/* 패널 공통 스타일 */
.info-panel, .prod-panel, .record-panel {
    background:#252540; padding:10px; border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3); 
    display: flex; flex-direction: column;
    height: 100%; 
    overflow: hidden; 
}

/* ★★★ 세로 모드 비율 최적화 (가로 스크롤 안 생기게) ★★★ */
.info-panel { flex: 2; min-width: 0; }  /* 좌측: 2 */
.prod-panel { flex: 4; min-width: 0; }  /* 중앙(입력): 4 (가장 넓게) */
.record-panel { flex: 2; min-width: 0; } /* 우측: 2 */

/* -------------------- 입력 요소 스타일 -------------------- */
label {
    display: block; margin-top: 5px; font-size: 14px;
    font-weight: 600; color: #ccc; line-height: 1.2;
}
input {
    width:100%; padding:8px; font-size:16px; border-radius:6px;
    border:1px solid #3e3e60; margin-top:3px; background:#333355;
    color:#fff; cursor:pointer; text-align: center;
}
/* 버튼 스타일 */
.buttons { margin-top:auto; padding-top:8px; display:flex; flex-direction: column; gap: 6px; }
.buttons button {
    width: 100%; padding:12px 0; font-size:16px; border-radius:8px;
    border:none; background:#3a79d8; color:#fff; font-weight:700;
    transition:background 0.2s;
}
.buttons button.btn-primary {background: #2ecc71;}
.buttons button:active {filter: brightness(0.9);}

/* 가로 배치 버튼 (상단 패널용) */
.info-panel .buttons { flex-direction: row; } 

/* -------------------- 제품 목록 (가운데 패널) -------------------- */
.multi-add-panel { padding-bottom: 8px; border-bottom: 1px solid #3e3e60; margin-bottom: 5px; }
.multi-add-panel .input-group { display: flex; gap: 5px; }
.multi-add-panel button { height: 40px; }

.prod-list { flex-grow: 1; overflow-y:auto; padding-right:2px; }
.prod-row { display:flex; align-items:center; margin-bottom:5px; gap: 4px; }
.prod-row div { font-size:13px; font-weight:600; width: 45px; text-align: center; }
.prod-row .input-len { flex: 3; text-align: left; padding-left: 10px; }
.prod-row .input-margin { flex: 1.5; color: #aaa; text-align: center; font-size: 14px; }
.prod-row .btn-delete-row { width: 25px; height: 25px; background: #e74c3c; border:none; border-radius:4px; color:#fff; font-weight:bold; }

/* -------------------- 기록 목록 (우측 패널) -------------------- */
.record-list { flex-grow: 1; overflow-y:auto; padding-right:2px; }
.record-item {
    padding:8px 5px; border-bottom: 1px solid #3e3e60;
    cursor:pointer; font-size: 13px;
}
.record-date { color: #888; font-size: 11px; margin-bottom: 2px; }
.record-summary { font-weight: bold; color: #ddd; }
.record-item:hover { background: #333355; }

/* -------------------- 하단 미리보기 (Cuts) -------------------- */
.cuts {
    flex: 1; /* 남은 높이 차지 */
    width: 100%; 
    margin-top: 10px;
    background: #252540;
    border-radius: 12px;
    padding: 10px;
    display: flex; flex-direction: column;
    overflow: hidden;
}
.cuts h3 { margin: 0 0 8px 0; color: #3498db; font-size: 16px; text-align: center; }
.preview-cuts-list { flex: 1; overflow-y: auto; padding: 0 5px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* 미리보기 카드 스타일 */
.cut-row {
    background: #1a1a2e; border-radius: 8px; padding: 10px;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid #3e3e60;
}
.cut-left { font-size: 13px; }
.cut-row .prod-name { color: #3498db; font-weight: bold; font-size: 15px; margin-bottom: 2px;}
.cut-pos { font-size: 24px; font-weight: 900; color: #e74c3c; }

/* -------------------- ★★★ 키패드 수정 (위치 & 배열) ★★★ -------------------- */
#softKeypad{
    position: fixed; 
    /* 바닥이 아니라 화면 중앙보다 약간 아래쪽 (손 뻗기 좋은 위치) */
    top: 55%; 
    left: 50%; 
    transform: translate(-50%, -50%);
    
    width:90%; max-width:380px; 
    background:#2f2f50; /* 배경색 살짝 밝게 */
    padding:15px;
    display: grid; 
    grid-template-columns: repeat(4, 1fr); 
    gap:8px;
    border-radius:20px; 
    box-shadow:0 10px 40px rgba(0,0,0,0.95); /* 그림자 진하게 */
    z-index:10002; 
    margin: 0;
    border: 1px solid #4a4a75;
}

.keypad-button{
    padding:20px 0; /* 버튼 높이 키움 */
    font-size:24px; font-weight:bold; background:#4a4a75;
    color:#fff; border:none; border-radius:10px; cursor:pointer;
    box-shadow: 0 4px 0 #333355; /* 입체감 */
}
.keypad-button:active { box-shadow: none; transform: translateY(4px); }
.keypad-action{background:#e74c3c !important; font-size: 18px !important; box-shadow: 0 4px 0 #c0392b;}

/* ★ 배열 복구 (V2.5 스타일) */
.keypad-button[data-key="7"] { grid-row: 1; grid-column: 1; }
.keypad-button[data-key="8"] { grid-row: 1; grid-column: 2; }
.keypad-button[data-key="9"] { grid-row: 1; grid-column: 3; }
.keypad-button[data-key="back"] { grid-row: 1; grid-column: 4; }

.keypad-button[data-key="4"] { grid-row: 2; grid-column: 1; }
.keypad-button[data-key="5"] { grid-row: 2; grid-column: 2; }
.keypad-button[data-key="6"] { grid-row: 2; grid-column: 3; }
.keypad-button[data-key="."] { grid-row: 2; grid-column: 4; background: #5a5a85;} /* 점 위치 */

.keypad-button[data-key="1"] { grid-row: 3; grid-column: 1; }
.keypad-button[data-key="2"] { grid-row: 3; grid-column: 2; }
.keypad-button[data-key="3"] { grid-row: 3; grid-column: 3; }
/* 확인(Enter) 버튼은 우측 하단 2칸 차지 */
#enterKey { 
    grid-row: 3 / span 2; 
    grid-column: 4; 
    background:#3498db !important; 
    box-shadow: 0 4px 0 #2980b9;
    display: flex; align-items: center; justify-content: center;
}

/* 0 버튼은 하단 3칸 차지 (넓게) */
.keypad-button[data-key="0"] { 
    grid-row: 4; 
    grid-column: 1 / span 3; 
}


/* 스크롤바 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #4a4a75; border-radius: 3px; }

/* 전체화면 오버레이 등 기존 CSS 유지 */
.fullscreen{ display:none; position:fixed; inset:0; background:#1a1a2e; z-index:9999; flex-direction:column; align-items:center; padding-top:20px; }
.fs-title{font-size:30px; margin-bottom:15px; color:#3498db;}
.fs-info-container { width: 95%; background: #252540; padding: 15px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-around;}
.cuts-fs { width: 95%; flex: 1; overflow-y: auto; }
.controls-bottom { position: fixed; bottom: 20px; }
.controls-bottom button { padding: 15px 40px; font-size: 20px; background: #e74c3c; color: white; border: none; border-radius: 10px; }

/* 모달 */
.custom-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:10001; justify-content:center; align-items:center;}
.custom-modal-content{background:#252540; padding:25px; border-radius:15px; width:300px; text-align:center;}
.modal-buttons button { margin: 10px 5px 0 5px; padding: 10px 20px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
#modalConfirmBtn { background: #3498db; color: white; }
#modalCancelBtn { background: #555; color: white; }

</style>
</head>
<body>
<h1>넘기기 작업 계산기 <span id="version-display">v3.1 (키패드수정)</span></h1>

<div class="content-wrapper">
    <div class="top-area">
        <div class="info-panel">
            <label>총 원단 (m)</label>
            <input type="text" readonly id="totalInput" placeholder="입력">
            
            <label>전체 여유 (%)</label>
            <input type="text" readonly id="marginInput" placeholder="2" value="2">
            
            <div class="buttons">
                <button id="calcBtn" type="button" class="btn-primary">계산하기</button>
                <button id="resetBtn" type="button" style="background: #555;">초기화</button>
            </div>
            <div class="buttons">
                <button id="fsBtn" type="button" style="background: #e67e22;">작업표 (전체)</button>
            </div>
        </div>

        <div class="prod-panel">
            <div class="multi-add-panel">
                <div class="input-group">
                    <input type="text" readonly id="multiProdLengthInput" placeholder="길이(m)" style="flex:1;">
                    <input type="text" readonly id="multiProdQtyInput" placeholder="수량" style="flex:0.6;">
                    <button id="addMultiProd" type="button" class="btn-primary" style="flex:0.6;">추가</button>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px; padding:0 5px;">
                <span style="font-size:12px; color:#aaa;">No.</span>
                <span style="font-size:12px; color:#aaa; margin-right: 30px;">길이(m)</span>
                <span style="font-size:12px; color:#aaa;">여유%</span>
                <span></span>
            </div>
            <div class="prod-list" id="prodList"></div>
            <div class="buttons">
                <button id="addProd" type="button">+ 1줄 추가</button>
            </div>
        </div>

        <div class="record-panel">
            <label style="margin-top:0;">최근 기록</label>
            <div class="record-list" id="recordList">
                <div style="padding:10px; text-align:center; color:#666; font-size: 13px;">기록 없음</div>
            </div>
        </div>
    </div>

    <div class="cuts" id="previewCuts">
        <h3>계산 결과 (총 재단 위치)</h3>
        <div class="preview-cuts-list" id="previewCutsList">
            <div style="padding:20px; text-align:center; color:#666; grid-column: span 2;">
                계산 결과가 여기에 표시됩니다.
            </div>
        </div>
    </div>
</div>

<div id="softKeypad" style="display: none;">
    <button class="keypad-button" data-key="7">7</button>
    <button class="keypad-button" data-key="8">8</button>
    <button class="keypad-button" data-key="9">9</button>
    <button class="keypad-button keypad-action del-key" data-key="back">←</button>
    
    <button class="keypad-button" data-key="4">4</button>
    <button class="keypad-button" data-key="5">5</button>
    <button class="keypad-button" data-key="6">6</button>
    <button class="keypad-button" data-key="." id="dotKey">.</button>
    
    <button class="keypad-button" data-key="1">1</button>
    <button class="keypad-button" data-key="2">2</button>
    <button class="keypad-button" data-key="3">3</button>
    <button class="keypad-button keypad-action" data-key="enter" id="enterKey">확인</button>
    
    <button class="keypad-button" data-key="0" id="zeroKey">0</button>
</div>

<div id="fsContainer" class="fullscreen">
  <div class="fs-title">작업 지시서</div>
    <div class="fs-info-container">
        <div class="fs-info-left" id="fsInfo" style="color:#ccc; font-size:18px; line-height:1.5;"></div>
        <div class="fs-info-right" id="fsSummary" style="color:#e74c3c; font-weight:bold; font-size:20px;"></div>
    </div>
  <div class="cuts cuts-fs" id="fsCuts" style="background:none; border:none; padding:0;"></div>
  <div class="controls-bottom">
    <button id="exitBtn" type="button">닫기</button>
  </div>
</div>

<div id="customModalOverlay" class="custom-modal-overlay">
    <div class="custom-modal-content">
        <div id="modalTitle" style="color:#3498db; font-size:18px; font-weight:bold; margin-bottom:10px;"></div>
        <div id="modalMessage" style="color:#ccc; margin-bottom:20px;"></div>
        <div class="modal-buttons">
            <button id="modalCancelBtn">취소</button>
            <button id="modalConfirmBtn">확인</button>
        </div>
    </div>
</div>
<div id="passwordModalOverlay" class="custom-modal-overlay">
    <div class="custom-modal-content">
        <div style="color:#e74c3c; font-size:18px; font-weight:bold; margin-bottom:10px;">삭제 암호</div>
        <input type="password" readonly id="passwordModalInput" placeholder="비밀번호" style="margin-bottom:15px;">
        <div class="modal-buttons">
            <button id="pwdCancelBtn" style="background:#555; color:white;">취소</button>
            <button id="pwdConfirmBtn" style="background:#e74c3c; color:white;">삭제</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
const STORAGE_KEY = 'cutCalculatorRecords_v3'; 
const DELETE_PASSWORD = '1205';

// DOM Elements
const prodList = document.getElementById('prodList');
const recordList = document.getElementById('recordList');
const totalInput = document.getElementById('totalInput');
const marginInput = document.getElementById('marginInput');
const previewCutsList = document.getElementById('previewCutsList');
const softKeypad = document.getElementById('softKeypad');
const dotKey = document.getElementById('dotKey');

// Variables
let cutPlan = [];
let focusedInput = null;
let modalCallback = null;
let currentDeleteId = null;

// --- 1. 초기화 및 로딩 ---
function init() {
    renderRecords(getRecords());
    // 기본 6개 생성
    for(let i=0; i<6; i++) createProdInput();
    updateMarginPlaceholders();
}

function getRecords(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } 
    catch (e) { return []; }
}
function saveRecords(records){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

// --- 2. 입력창 생성 로직 ---
function createProdInput(len='', margin=''){
    const row = document.createElement('div');
    row.className = 'prod-row';
    row.innerHTML = `
        <div></div>
        <input type="text" readonly class="input-len" placeholder="길이" value="${len}">
        <input type="text" readonly class="input-margin" placeholder="기본" value="${margin}">
        <button type="button" class="btn-delete-row">X</button>
    `;
    
    // 이벤트 바인딩
    const iLen = row.querySelector('.input-len');
    const iMar = row.querySelector('.input-margin');
    iLen.addEventListener('click', onInputClick);
    iMar.addEventListener('click', onInputClick);
    
    row.querySelector('.btn-delete-row').addEventListener('click', () => {
        if(prodList.children.length > 1) { row.remove(); updateLabels(); }
    });

    prodList.appendChild(row);
    updateLabels();
    updateMarginPlaceholders();
}

function updateLabels(){
    Array.from(prodList.children).forEach((row, i) => {
        row.querySelector('div').innerText = (i+1);
    });
}
function updateMarginPlaceholders() {
    const global = marginInput.value || '0';
    prodList.querySelectorAll('.input-margin').forEach(el => el.placeholder = `기본(${global})`);
}

// --- 3. 키패드 & 스마트 엔터 ---
function onInputClick(e){
    if(focusedInput) focusedInput.style.border = '1px solid #3e3e60';
    focusedInput = e.target;
    focusedInput.style.border = '2px solid #3498db';
    softKeypad.style.display = 'grid';
    dotKey.classList.remove('disabled');
}

softKeypad.addEventListener('click', (e) => {
    const key = e.target.dataset.key;
    if(!key || !focusedInput) return;

    if(key === 'enter'){
        handleSmartEnter();
        return;
    }
    
    let val = focusedInput.value;
    if(key === 'back') focusedInput.value = val.slice(0, -1);
    else if(key === '.') { if(!val.includes('.')) focusedInput.value += '.'; }
    else focusedInput.value += key;

    if(focusedInput === marginInput) updateMarginPlaceholders();
});

function handleSmartEnter(){
    // 1. 길이 입력창일 때 -> 다음 줄 길이로 (마진 스킵)
    if(focusedInput.classList.contains('input-len')){
        const nextRow = focusedInput.parentElement.nextElementSibling;
        if(nextRow) {
            triggerClick(nextRow.querySelector('.input-len'));
        } else {
            createProdInput();
            const newRows = prodList.children;
            triggerClick(newRows[newRows.length-1].querySelector('.input-len'));
            newRows[newRows.length-1].scrollIntoView({behavior:'smooth', block:'center'});
        }
        return;
    }
    // 2. 마진 입력창일 때 -> 다음 줄 길이로
    if(focusedInput.classList.contains('input-margin')){
        const nextRow = focusedInput.parentElement.nextElementSibling;
        if(nextRow) triggerClick(nextRow.querySelector('.input-len'));
        else {
            createProdInput();
            const newRows = prodList.children;
            triggerClick(newRows[newRows.length-1].querySelector('.input-len'));
        }
        return;
    }
    // 3. 순차 이동 (총원단 -> 마진 -> 첫 제품)
    const inputs = [totalInput, marginInput];
    const idx = inputs.indexOf(focusedInput);
    if(idx === 0) triggerClick(marginInput);
    else if(idx === 1) triggerClick(prodList.firstElementChild.querySelector('.input-len'));
    else closeKeypad();
}

function triggerClick(el){ if(el) el.click(); }
function closeKeypad(){ 
    softKeypad.style.display='none'; 
    if(focusedInput) focusedInput.style.border='1px solid #3e3e60';
    focusedInput=null; 
}

// 외부 클릭 시 키패드 닫기
document.addEventListener('click', (e) => {
    if(!e.target.closest('#softKeypad') && !e.target.tagName.match(/INPUT|BUTTON/)){
        closeKeypad();
    }
});

// --- 4. 계산 로직 ---
document.getElementById('calcBtn').addEventListener('click', () => {
    const total = parseFloat(totalInput.value);
    if(!total) { showModal('오류', '총 원단 길이를 입력하세요.'); return; }
    
    const globalMargin = parseFloat(marginInput.value) || 0;
    const items = [];
    
    // 데이터 수집
    Array.from(prodList.children).forEach((row, i) => {
        const l = parseFloat(row.querySelector('.input-len').value);
        if(l > 0) {
            const mVal = row.querySelector('.input-margin').value;
            const m = (mVal === '') ? globalMargin : parseFloat(mVal);
            items.push({ idx: i+1, len: l, margin: m });
        }
    });

    if(items.length === 0) { showModal('오류', '제품을 하나 이상 입력하세요.'); return; }

    // 계산
    const totalMm = Math.round(total * 1000);
    let currentMm = 0;
    cutPlan = [];
    
    for(let item of items){
        const lenMm = Math.round(item.len * 1000);
        // 계산식: Max(길이 + 마진%, 길이 + 1m)
        const withMargin = Math.round(lenMm * (1 + item.margin/100));
        const withMin = lenMm + 1000;
        const reqMm = Math.max(withMargin, withMin);
        
        currentMm += reqMm;
        
        if(currentMm > totalMm) {
            showModal('초과', `제품 ${item.idx}번에서 원단 길이를 초과했습니다.`);
            break;
        }
        
        cutPlan.push({
            idx: item.idx,
            len: item.len,
            margin: item.margin,
            req: reqMm / 1000,
            pos: Math.floor((totalMm - currentMm)/1000)
        });
    }

    renderResult();
    saveResult(items);
    closeKeypad();
});

function renderResult(){
    previewCutsList.innerHTML = '';
    if(cutPlan.length === 0) {
        previewCutsList.innerHTML = '<div style="padding:20px;grid-column:span 2;text-align:center;">계산 결과 없음</div>';
        return;
    }
    
    cutPlan.forEach(p => {
        const div = document.createElement('div');
        div.className = 'cut-row';
        div.innerHTML = `
            <div class="cut-left">
                <div class="prod-name">No.${p.idx} (${p.len}m)</div>
                <div style="color:#888;">필요: ${p.req}m (여유${p.margin}%)</div>
            </div>
            <div class="cut-pos">${p.pos}</div>
        `;
        previewCutsList.appendChild(div);
    });
}

function saveResult(prodData){
    const recs = getRecords();
    recs.unshift({
        id: Date.now(),
        date: new Date().toLocaleString(),
        total: totalInput.value,
        margin: marginInput.value,
        prods: prodData,
        result: cutPlan
    });
    saveRecords(recs);
    renderRecords(recs);
}

function renderRecords(recs){
    recordList.innerHTML = '';
    if(recs.length === 0) {
        recordList.innerHTML = '<div style="padding:10px;text-align:center;color:#666;">기록 없음</div>';
        return;
    }
    recs.forEach(r => {
        const div = document.createElement('div');
        div.className = 'record-item';
        div.innerHTML = `
            <div>
                <div class="record-date">${r.date}</div>
                <div class="record-summary">총 ${r.total}m / 제품 ${r.prods.length}개</div>
            </div>
            <button class="record-delete" style="color:#e74c3c;background:none;border:none;font-weight:bold;">X</button>
        `;
        // 불러오기
        div.addEventListener('click', (e) => {
            if(e.target.tagName === 'BUTTON') return;
            loadRecord(r);
        });
        // 삭제
        div.querySelector('button').addEventListener('click', () => {
            currentDeleteId = r.id;
            document.getElementById('passwordModalOverlay').style.display='flex';
        });
        recordList.appendChild(div);
    });
}

function loadRecord(r){
    totalInput.value = r.total;
    marginInput.value = r.margin;
    prodList.innerHTML = '';
    r.prods.forEach(p => createProdInput(p.len, p.margin));
    // 빈칸 채우기
    while(prodList.children.length < 6) createProdInput();
    
    cutPlan = r.result || [];
    renderResult();
    updateMarginPlaceholders();
    showModal('완료', '기록을 불러왔습니다.');
}

// --- 5. 기타 기능들 (초기화, 전체화면, 모달 등) ---
document.getElementById('resetBtn').addEventListener('click', () => {
    showModal('확인', '초기화 하시겠습니까?', true, (yes)=>{
        if(yes) {
            totalInput.value = '';
            marginInput.value = '2';
            prodList.innerHTML = '';
            for(let i=0;i<6;i++) createProdInput();
            previewCutsList.innerHTML = '<div style="padding:20px;grid-column:span 2;text-align:center;">초기화 됨</div>';
            updateMarginPlaceholders();
        }
    });
});

// 전체화면 (작업표)
document.getElementById('fsBtn').addEventListener('click', () => {
    if(cutPlan.length === 0) { showModal('알림', '먼저 계산을 수행하세요.'); return; }
    const fsDiv = document.getElementById('fsContainer');
    const fsCuts = document.getElementById('fsCuts');
    
    document.getElementById('fsInfo').innerText = `총 원단: ${totalInput.value}m\n기본 여유: ${marginInput.value}%`;
    document.getElementById('fsSummary').innerText = `총 ${cutPlan.length}개 제품`;
    
    fsCuts.innerHTML = '';
    cutPlan.forEach(p => {
        const div = document.createElement('div');
        div.className = 'cut-row';
        div.style.marginBottom = '10px';
        div.style.background = '#2f2f50';
        div.innerHTML = `
            <div class="cut-left">
                <div class="prod-name" style="font-size:24px;">No.${p.idx} (${p.len}m)</div>
                <div style="font-size:16px;color:#aaa;">필요: ${p.req}m (여유${p.margin}%)</div>
            </div>
            <div class="cut-pos" style="font-size:50px;">${p.pos}</div>
        `;
        fsCuts.appendChild(div);
    });
    fsDiv.style.display = 'flex';
});
document.getElementById('exitBtn').addEventListener('click', () => document.getElementById('fsContainer').style.display='none');

// 다중 추가
document.getElementById('addMultiProd').addEventListener('click', () => {
    const l = document.getElementById('multiProdLengthInput').value;
    const q = parseInt(document.getElementById('multiProdQtyInput').value);
    if(!l || !q) return;
    
    // 빈칸 찾기
    const rows = Array.from(prodList.children);
    let filled = 0;
    for(let row of rows){
        if(filled >= q) break;
        const inp = row.querySelector('.input-len');
        if(!inp.value) { inp.value = l; filled++; }
    }
    for(let i=0; i < (q-filled); i++) createProdInput(l);
    
    document.getElementById('multiProdLengthInput').value = '';
    document.getElementById('multiProdQtyInput').value = '';
});
document.getElementById('addProd').addEventListener('click', () => createProdInput());

// 입력창 클릭 시 키패드 연결
[totalInput, marginInput, document.getElementById('multiProdLengthInput'), document.getElementById('multiProdQtyInput')].forEach(el => {
    el.addEventListener('click', onInputClick);
});

// 모달 로직
const modal = document.getElementById('customModalOverlay');
const pwdModal = document.getElementById('passwordModalOverlay');

function showModal(title, msg, hasConfirm=false, cb=null){
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = msg;
    const confBtn = document.getElementById('modalConfirmBtn');
    confBtn.style.display = hasConfirm ? 'inline-block' : 'none';
    modalCallback = cb;
    modal.style.display = 'flex';
}
document.getElementById('modalCancelBtn').addEventListener('click', () => { modal.style.display='none'; if(modalCallback) modalCallback(false); });
document.getElementById('modalConfirmBtn').addEventListener('click', () => { modal.style.display='none'; if(modalCallback) modalCallback(true); });

// 비번 모달
const pwdInput = document.getElementById('passwordModalInput');
pwdInput.addEventListener('click', onInputClick);
document.getElementById('pwdCancelBtn').addEventListener('click', () => { pwdModal.style.display='none'; closeKeypad(); });
document.getElementById('pwdConfirmBtn').addEventListener('click', () => {
    if(pwdInput.value === DELETE_PASSWORD) {
        const recs = getRecords().filter(r => r.id !== currentDeleteId);
        saveRecords(recs);
        renderRecords(recs);
        pwdModal.style.display='none';
        pwdInput.value = '';
        closeKeypad();
    } else {
        alert('비밀번호 불일치');
    }
});

// 시작
init();

});
</script>
</body>
</html>
