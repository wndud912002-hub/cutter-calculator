<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.8, maximum-scale=2.0, user-scalable=yes">
<title>넘기기 작업 계산기 (V3.2 정수계산)</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* -------------------- 전역 스타일 -------------------- */
html, body {
    margin:0; padding:0; height:100%;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#1a1a2e; color:#fff;
    overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
h1{
    position: relative;
    text-align:center; margin:0; padding:12px; font-size:26px;
    color:#f0f0f0; background:#1a1a2e;
    height: 60px;
}
#version-display {
    position: absolute; top: 8px; right: 20px;
    font-size: 12px; font-weight: 500; color: #888;
}
.content-wrapper {
    position: absolute; top:60px; left:0; right:0; bottom:0;
    overflow: hidden; padding-bottom:10px;
    display:flex; flex-direction:column; align-items:center;
}

/* -------------------- 메인 레이아웃 (3분할) -------------------- */
.top-area {
    width:96%; max-width:1400px;
    display:flex; justify-content:space-between; gap:8px; margin:10px auto;
    align-items: stretch;
    height: 60vh; min-height: 400px; 
}
.info-panel, .prod-panel, .record-panel {
    background:#252540; padding:12px; border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3); 
    display: flex; flex-direction: column;
    height: 100%; overflow: hidden; 
}

/* 패널 너비 비율 */
.info-panel{flex:1; min-width:180px;} 
.prod-panel{flex:1.6; min-width:280px;} 
.record-panel{flex:1; min-width:180px;}

/* -------------------- 입력 및 버튼 -------------------- */
label {
    display: block; margin-top: 8px; font-size: 15px;
    font-weight: 600; color: #ccc; line-height: 1.2;
}
input{
    width:100%; padding:8px 10px; font-size:18px; border-radius:8px;
    border:1px solid #3e3e60; margin-top:4px; background:#333355;
    color:#fff; cursor:pointer;
}
.buttons{margin-top:auto; padding-top:10px; display:flex; justify-content:space-between; flex-wrap:wrap; gap: 6px;}
.buttons button{
    flex:1; margin:0; padding:10px 0; font-size:15px; border-radius:8px;
    border:none; background:#3a79d8; color:#fff; font-weight:700;
    transition:background 0.2s; user-select:none;
}
.buttons button.btn-primary {background: #2ecc71;}
.buttons button:active{filter: brightness(0.9);}

/* 리스트 영역 */
.prod-list, .record-list {
    flex-grow: 1; margin-top:10px; overflow-y:auto; padding-right:5px; height: 0; 
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: #4a4a75; border-radius: 4px; }
::-webkit-scrollbar-track { background: #1a1a2e; }

/* 제품 입력 행 스타일 (2칸) */
.prod-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap: 6px;}
.prod-row div{font-size:14px; font-weight:600; min-width:50px; margin-bottom:0;}
.prod-row .input-len { flex: 2 !important; } 
.prod-row .input-margin { flex: 1 !important; color: #aaa; text-align: center;} 
.prod-row .input-margin:focus, .prod-row .input-margin.active-input { color: #fff; border-color: #3498db; }
.prod-row .input-margin::placeholder { color: #666; font-size: 14px; }

.record-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 5px; border-bottom: 1px solid #3e3e60;
    cursor:pointer; transition: background 0.1s;
}
.record-details{flex:1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
.record-item:hover{background: #333355;}
.record-delete{
    background:none; border:none; color:#e74c3c; font-size:16px;
    font-weight:bold; cursor:pointer; padding:5px; margin-left:5px;
    flex-shrink: 0; line-height: 1;
}
.record-date{font-size:12px; color:#b0b0d0;}
.record-summary{font-size:14px; font-weight:700;}

/* 여러 개 추가 UI */
.multi-add-panel { padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid #3e3e60; }
.multi-add-panel .input-group { display: flex; gap: 8px; align-items: flex-end; }
.multi-add-panel .input-group > div { flex: 1; }
.multi-add-panel button { height: 42px; flex: 0.8; }

/* -------------------- 미리보기 -------------------- */
.cuts{
    width:96%; max-width:800px; margin:5px auto; text-align:center;
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
.cuts h3{margin-bottom:8px; color:#3498db; font-size:18px; margin-top: 0;}
.preview-cuts-list{
    flex: 1; overflow-y: auto; padding-right: 10px; padding-bottom: 10px;
    max-height: calc(100vh - 65vh - 80px); 
}
.cut-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 15px; border-radius:10px; background:#252540;
    margin-bottom:6px; box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.cut-left{display:flex; flex-direction:column; text-align:left; gap: 4px;}
.cut-row .prod-name{font-size:16px; font-weight:700; color:#3498db;}
.cut-row .prod-len{font-size:12px; color:#b0b0d0;}
.cut-row .prod-len b { color: #2ecc71; font-weight: 700; }
.cut-row .cut-pos{font-size:26px; font-weight:900; color:#e74c3c;}

/* -------------------- 키패드 (기존 디자인) -------------------- */
#softKeypad{
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    width:95%; max-width:380px; background:#252540; padding:8px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap:6px;
    border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.8); z-index:10002; margin: 0;
}
.keypad-button{
    padding:15px; font-size:22px; font-weight:bold; background:#4a4a75;
    color:#fff; border:none; border-radius:8px; user-select:none;
    cursor:pointer; transition:background 0.1s; touch-action:manipulation;
}
.keypad-button:active{background:#3a3a60;}
.keypad-button.disabled { opacity: 0.3; cursor: not-allowed; background: #4a4a75 !important; }
.keypad-action{background:#e74c3c !important; font-size: 18px !important;}
.keypad-action:active{background:#c0392b !important;}
#enterKey{background:#3498db !important; font-size: 18px !important; grid-row: 3 / span 2; grid-column: 4;}
#enterKey:active{background:#2980b9 !important;}
.keypad-button[data-key="7"] { grid-row: 1; grid-column: 1; }
.keypad-button[data-key="8"] { grid-row: 1; grid-column: 2; }
.keypad-button[data-key="9"] { grid-row: 1; grid-column: 3; }
.keypad-button[data-key="back"] { grid-row: 1; grid-column: 4; }
.keypad-button[data-key="4"] { grid-row: 2; grid-column: 1; }
.keypad-button[data-key="5"] { grid-row: 2; grid-column: 2; }
.keypad-button[data-key="6"] { grid-row: 2; grid-column: 3; }
.keypad-button[data-key="."]{ grid-row: 2; grid-column: 4;}
.keypad-button[data-key="1"] { grid-row: 3; grid-column: 1; }
.keypad-button[data-key="2"] { grid-row: 3; grid-column: 2; }
.keypad-button[data-key="3"] { grid-row: 3; grid-column: 3; }
.keypad-button[data-key="0"] { grid-row: 4; grid-column: 1 / span 3; }

/* -------------------- 전체화면 -------------------- */
.fullscreen{
    display:none; position:fixed; inset:0; background:#1a1a2e; z-index:9999;
    flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:20px; overflow-y:hidden;
}
.fs-title{font-size:28px; margin-bottom:10px; color:#3498db; font-weight:700;}
.fs-info-container {
    display: flex; justify-content: space-between; width: 95%; max-width: 900px;
    margin-bottom: 15px; background: #252540; padding: 12px; border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.fs-info-left, .fs-info-right {flex: 1; min-width: 0; text-align: center;}
.fs-info-title {font-size: 16px; color: #f0f0f0; font-weight: 700; margin-bottom: 6px;}
.fs-info-text {font-size: 15px; color: #ccc; line-height: 1.4; white-space: pre-wrap;}
.fs-summary {font-size: 16px; color: #e74c3c; margin-bottom: 6px; font-weight: 900;}
.fs-sub {
    font-size: 13px; color: #ccc; white-space: pre-wrap; text-align: center;
    max-height: 80px; overflow-y: auto; padding: 0 10px; box-sizing: border-box;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px;
}
.cuts-title-row {
    display: flex; justify-content: space-between; width: 95%; max-width: 900px;
    padding: 8px 20px; box-sizing: border-box; margin-top: 10px;
    border-bottom: 2px solid #3498db; font-weight: 900; font-size: 18px; color: #3498db;
}
.cuts-title-row .cuts-title-left { text-align: left; flex: 1; }
.cuts-title-row .cuts-title-right { flex: 1; text-align: center; }
.cuts-fs{
    max-height: calc(100vh - 250px); overflow-y:auto; width:95%; max-width:900px;
    margin-bottom:10px;
}
.controls-bottom{position:fixed; bottom:10px; display:flex; gap:12px;}
.controls-bottom button{padding:10px 20px; font-size:16px; border-radius:10px; border:none; background:#e74c3c; color:#fff; font-weight:700;}
.controls-bottom button:active{background:#c0392b;}

#fsCuts .cut-row{
    margin-bottom: 5px; padding: 10px 20px; border-radius: 10px; background: #2f2f50;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3); align-items: center; display: flex;
    transition: background-color 0.2s;
}
#fsCuts .cut-left {flex: 1; display: flex; flex-direction: column; align-items: flex-start;}
#fsCuts .prod-name-row {display: flex; align-items: baseline; gap: 8px;}
#fsCuts .prod-name{font-size:26px; font-weight:900; color:#3498db;}
#fsCuts .main-len{font-size:28px; font-weight:900; color: #f0f0f0;}
#fsCuts .required-len{font-size:14px; color:#b0b0d0; font-weight:500; margin-top: 2px;}
#fsCuts .required-len b { color: #2ecc71; font-weight: 700; font-size: 16px; }
#fsCuts .cut-pos{
    flex: 1; text-align: center; font-size:60px; font-weight:900; color:#e74c3c;
}

/* 모달 및 개별 삭제 버튼 */
.custom-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:10001; justify-content:center; align-items:center; padding:20px;}
.custom-modal-content{background:#252540; padding:20px; border-radius:15px; width:90%; max-width:380px; box-shadow:0 0 20px rgba(0,0,0,0.5); text-align:center;}
.modal-title{font-size:20px; font-weight:700; color:#3498db; margin-bottom:12px;}
.modal-message{font-size:15px; color:#ccc; margin-bottom:18px; white-space:pre-wrap;}
.modal-buttons button{padding:8px 18px; font-size:15px; border-radius:8px; border:none; font-weight:700; transition:background 0.2s; cursor:pointer;}
#passwordModalInput{ width:100%; padding:10px; font-size:20px; border-radius:8px; border:1px solid #3e3e60; margin-top:10px; background:#333355; color:#fff; box-sizing:border-box; text-align:center; }
#modalConfirmBtn{background:#3a79d8; color:#fff; margin-left:10px;}
#modalCancelBtn{background:#555; color:#fff;}
#passwordModalOverlay .modal-buttons button {width: 48%;}
#pwdConfirmBtn {background: #e74c3c !important;}
#pwdConfirmBtn:active {background: #c0392b !important;}
.btn-delete-row {
    background: #e74c3c; color: white; border: none; border-radius: 50%;
    width: 24px; height: 24px; font-size: 12px; font-weight: bold;
    cursor: pointer; margin-left: 5px; flex-shrink: 0;
}
.btn-delete-row:hover { background: #c0392b; }

</style>
</head>
<body>
<h1>
    넘기기 작업 계산기
    <span id="version-display">v3.2 (정수계산)</span>
</h1>
<div class="content-wrapper">
<div class="top-area">
<div class="info-panel">
<label>총 원단 길이 (m)</label>
<input type="text" readonly id="totalInput" placeholder="예: 501.54">
<label>전체 여유율 (%)</label>
<input type="text" readonly id="marginInput" placeholder="예: 2" value="2">
<div class="buttons">
<button id="calcBtn" type="button" class="btn-primary">계산하기</button>
<button id="resetBtn" type="button">초기화</button>
<button id="fsBtn" type="button">작업표</button>
</div>
</div>
<div class="prod-panel">
    <div class="multi-add-panel">
        <label>여러 개 추가</label>
        <div class="input-group">
            <div>
                <input type="text" readonly id="multiProdLengthInput" placeholder="길이 (m)">
            </div>
             <div>
                <input type="text" readonly id="multiProdQtyInput" placeholder="수량">
            </div>
            <button id="addMultiProd" type="button" class="btn-primary">추가</button>
        </div>
    </div>

    <div style="display:flex; justify-content:space-between; margin-top:10px;">
        <label>제품 목록</label>
        <label style="font-size:12px; color:#888;">[길이 m] [개별%]</label>
    </div>
    <div class="prod-list" id="prodList"></div>
    <div class="buttons" style="padding-top: 5px;">
        <button id="addProd" type="button">+ 1개 추가</button>
    </div>
</div>
<div class="record-panel">
    <label>저장된 계산 기록</label>
    <div class="record-list" id="recordList">
        <div style="padding:15px; text-align:center; color:#ccc;">저장된 기록이 없습니다.</div>
    </div>
</div>
</div>
<div class="cuts" id="previewCuts">
<h3>계산 결과 미리보기 (재단 위치)</h3>
<div class="preview-cuts-list" id="previewCutsList">
    <div style="padding:15px; text-align:center; color:#ccc;">계산된 재단 목록이 없습니다.</div>
</div>
</div>
</div>

<div id="softKeypad" style="display: none;">
    <button class="keypad-button" data-key="7">7</button>
    <button class="keypad-button" data-key="8">8</button>
    <button class="keypad-button" data-key="9">9</button>
    <button class="keypad-button keypad-action del-key" data-key="back">DEL</button>
    <button class="keypad-button" data-key="4">4</button>
    <button class="keypad-button" data-key="5">5</button>
    <button class="keypad-button" data-key="6">6</button>
    <button class="keypad-button keypad-action" data-key="enter" id="enterKey">확인</button>
    <button class="keypad-button" data-key="1">1</button>
    <button class="keypad-button" data-key="2">2</button>
    <button class="keypad-button" data-key="3">3</button>
    <button class="keypad-button" data-key="." id="dotKey">.</button>
    <button class="keypad-button" data-key="0" id="zeroKey">0</button>
</div>

<div id="fsContainer" class="fullscreen">
  <div class="fs-title">재단 위치 표시</div>
    <div class="fs-info-container">
        <div class="fs-info-left">
            <div class="fs-info-title">원단 정보</div>
            <div class="fs-info-text" id="fsInfo"></div>
        </div>
        <div class="fs-info-right">
            <div class="fs-summary" id="fsSummary"></div>
            <div class="fs-sub" id="fsSub"></div>
        </div>
    </div>
    <div class="cuts-title-row">
        <div class="cuts-title-left">제품 정보</div>
        <div class="cuts-title-right">재단 위치</div>
    </div>
  <div class="cuts cuts-fs" id="fsCuts"></div>
  <div class="controls-bottom">
    <button id="exitBtn" type="button">종료</button>
  </div>
</div>
<div id="customModalOverlay" class="custom-modal-overlay">
    <div class="custom-modal-content">
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalMessage" class="modal-message"></div>
        <div class="modal-buttons">
            <button id="modalCancelBtn" type="button">취소</button>
            <button id="modalConfirmBtn" type="button">확인</button>
        </div>
    </div>
</div>
<div id="passwordModalOverlay" class="custom-modal-overlay">
    <div class="custom-modal-content">
        <div class="modal-title">기록 삭제 보안 확인</div>
        <div class="modal-message">기록을 삭제하려면 비밀번호를 입력해주세요.</div>
        <input type="password" readonly id="passwordModalInput" placeholder="비밀번호 입력" inputmode="numeric">
        <div class="modal-buttons" style="margin-top:20px;">
            <button id="pwdCancelBtn" type="button">취소</button>
            <button id="pwdConfirmBtn" type="button">삭제 확인</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
const MAX_PROD = 30;
const STORAGE_KEY = 'cutCalculatorRecords_v2'; 
const DELETE_PASSWORD = '1205';

const prodList = document.getElementById('prodList');
const recordList = document.getElementById('recordList');
const totalInput = document.getElementById('totalInput');
const marginInput = document.getElementById('marginInput');
const addBtn = document.getElementById('addProd');
const calcBtn = document.getElementById('calcBtn');
const resetBtn = document.getElementById('resetBtn');
const previewCutsList = document.getElementById('previewCutsList');
const fsBtn = document.getElementById('fsBtn');
const fsContainer = document.getElementById('fsContainer');
const exitBtn = document.getElementById('exitBtn');
const softKeypad = document.getElementById('softKeypad');
const fsSummary = document.getElementById('fsSummary');
const fsInfo = document.getElementById('fsInfo');
const fsSub = document.getElementById('fsSub');
const dotKey = document.getElementById('dotKey');

const customModalOverlay = document.getElementById('customModalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalMessage = document.getElementById('modalMessage');
const modalConfirmBtn = document.getElementById('modalConfirmBtn');
const modalCancelBtn = document.getElementById('modalCancelBtn');

const passwordModalOverlay = document.getElementById('passwordModalOverlay');
const passwordModalInput = document.getElementById('passwordModalInput');
const pwdConfirmBtn = document.getElementById('pwdConfirmBtn');
const pwdCancelBtn = document.getElementById('pwdCancelBtn');

const addMultiBtn = document.getElementById('addMultiProd');
const multiLengthInput = document.getElementById('multiProdLengthInput');
const multiQtyInput = document.getElementById('multiProdQtyInput');

let cutPlan = [];
let focusedInput = null;
let modalCallback = null;
let currentDeleteId = null;
let currentCutIndex = 0;

function getRecords(){
    try {
        const json = localStorage.getItem(STORAGE_KEY);
        return json ? JSON.parse(json) : [];
    } catch (e) { console.error("Error reading localStorage:", e); return []; }
}

function saveRecords(records){
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch (e) { console.error("Error writing localStorage:", e); showModal('저장 오류', '계산 기록을 기기에 저장하는 데 실패했습니다.', false); }
}

function saveResult(){
    const currentRecords = getRecords();
    const prodData = [];
    
    prodList.querySelectorAll('.prod-row').forEach(row => {
        const lenInput = row.querySelector('.input-len');
        const marginInput = row.querySelector('.input-margin');
        const lenVal = parseFloat(lenInput.value);
        if(lenVal > 0) {
            prodData.push({
                len: lenInput.value,
                margin: marginInput.value
            });
        }
    });

    if (prodData.length === 0) return;

    const newRecord = {
        id: Date.now(),
        timestamp: new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
        totalInput: totalInput.value,
        marginInput: marginInput.value,
        prodData: prodData, 
        cutPlan: cutPlan
    };

    currentRecords.unshift(newRecord);
    saveRecords(currentRecords);
    renderRecords(currentRecords);
}

function restoreRecord(record){
    prodList.innerHTML = '';
    totalInput.value = record.totalInput;
    marginInput.value = record.marginInput;
    
    if (record.prodData) {
        record.prodData.forEach(item => createProdInput(item.len, item.margin));
    } else if (record.prodInputs) {
        record.prodInputs.forEach(val => createProdInput(val, ''));
    }

    let currentProdCount = prodList.querySelectorAll('.prod-row').length;
    while(currentProdCount < 6){
        createProdInput('');
        currentProdCount++;
    }
    cutPlan = record.cutPlan;
    updateMarginPlaceholders(); 
    renderPreview();
    showModal('기록 불러오기','선택한 기록으로 계산기 입력값이 복원되었습니다.',false);
}

function deleteRecord(id){
    currentDeleteId = id;
    showPasswordModal();
}

function processDelete(){
    const idToDelete = currentDeleteId;
    let currentRecords = getRecords();
    currentRecords = currentRecords.filter(record => record.id !== idToDelete);
    saveRecords(currentRecords);
    renderRecords(currentRecords);
    showModal('삭제 완료', '선택한 계산 기록이 삭제되었습니다.', false);
    currentDeleteId = null;
}

function renderRecords(records){
    recordList.innerHTML = '';
    if(records.length === 0){
        recordList.innerHTML = '<div style="padding:15px; text-align:center; color:#ccc;">저장된 기록이 없습니다.</div>';
        return;
    }

    records.forEach(record => {
        const item = document.createElement('div');
        item.className = 'record-item';
        item.setAttribute('data-id', record.id);
        
        item.addEventListener('click', (e) => {
            if(e.target.className.includes('record-delete') || e.target.tagName === 'BUTTON') return;
            restoreRecord(record);
        });

        const numProds = record.prodData ? record.prodData.length : record.prodInputs.length;
        const totalLen = Math.floor(parseFloat(record.totalInput));

        item.innerHTML = `
            <div class="record-details">
                <div class="record-date">${record.timestamp}</div>
                <div class="record-summary">총 ${totalLen}m / 제품 ${numProds}개</div>
            </div>
            <button class="record-delete" type="button" data-id="${record.id}">❌</button>
        `;

        item.querySelector('.record-delete').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteRecord(record.id);
        });

        recordList.appendChild(item);
    });
}

function removeFocus(input) {
    if(input) {
        input.style.border='1px solid #3e3e60';
        input.classList.remove('active-input');
    }
}

function inputClickHandler(event){
    removeFocus(focusedInput);
    focusedInput = event.target;
    focusedInput.style.border='1px solid #3498db';
    focusedInput.classList.add('active-input');
    softKeypad.style.display='grid';
    dotKey.classList.remove('disabled');
}

function updateMarginPlaceholders() {
    const globalVal = marginInput.value || '0';
    const prodRows = prodList.querySelectorAll('.prod-row');
    prodRows.forEach(row => {
        const marginInput = row.querySelector('.input-margin');
        marginInput.placeholder = `기본(${globalVal})`;
    });
}

function createProdInput(lenValue='', marginValue=''){
    const row=document.createElement('div');
    row.className='prod-row';
    row.innerHTML=`
        <div></div>
        <input type="text" readonly class="input-len" placeholder="길이" value="${lenValue}">
        <input type="text" readonly class="input-margin" placeholder="기본" value="${marginValue}">
        <button type="button" class="btn-delete-row">X</button>
    `;
    
    const inputLen = row.querySelector('.input-len');
    const inputMargin = row.querySelector('.input-margin');
    
    inputLen.addEventListener('click', inputClickHandler);
    inputMargin.addEventListener('click', inputClickHandler);
    
    row.querySelector('.btn-delete-row').addEventListener('click', () => {
        if (prodList.querySelectorAll('.prod-row').length > 1) {
            row.remove();
            updateProdLabels();
        } else {
            showModal('경고', "최소 1개 제품은 유지해야 합니다.", false);
        }
    });
    prodList.appendChild(row);
    updateProdLabels();
    updateMarginPlaceholders(); 
    
    setTimeout(() => {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
}

function initializeProdInputs(){
    removeFocus(focusedInput);
    focusedInput=null;
    softKeypad.style.display='none';
    prodList.innerHTML='';
    cutPlan=[];
    for(let i=0;i<6;i++) createProdInput('','');
}

function updateProdLabels() {
    const rows = prodList.querySelectorAll('.prod-row');
    rows.forEach((row, index) => {
        row.querySelector('div').textContent = `제품 ${index + 1}`;
    });
}

totalInput.addEventListener('click', inputClickHandler);
marginInput.addEventListener('click', inputClickHandler);
passwordModalInput.addEventListener('click', inputClickHandler);
multiLengthInput.addEventListener('click', inputClickHandler);
multiQtyInput.addEventListener('click', inputClickHandler);
initializeProdInputs();

softKeypad.addEventListener('click',(event)=>{
    const key=event.target.dataset.key;
    if(!key||!focusedInput) return;
    
    let val=focusedInput.value;
    
    if(key==='enter'){
        if(focusedInput === passwordModalInput) { pwdConfirmBtn.click(); return; }
        if (focusedInput === multiLengthInput) { multiQtyInput.click(); return; }
        if (focusedInput === multiQtyInput) { addMultiBtn.click(); return; }

        if (focusedInput.classList.contains('input-len')) {
            const currentRow = focusedInput.closest('.prod-row');
            const nextRow = currentRow.nextElementSibling;
            
            if (nextRow) {
                const nextLenInput = nextRow.querySelector('.input-len');
                inputClickHandler({ target: nextLenInput });
            } else {
                createProdInput(); 
                const newRows = prodList.querySelectorAll('.prod-row');
                const newLenInput = newRows[newRows.length - 1].querySelector('.input-len');
                inputClickHandler({ target: newLenInput });
            }
            return;
        }

        if (focusedInput.classList.contains('input-margin')) {
            const currentRow = focusedInput.closest('.prod-row');
            const nextRow = currentRow.nextElementSibling;
             if (nextRow) {
                const nextLenInput = nextRow.querySelector('.input-len');
                inputClickHandler({ target: nextLenInput });
            } else {
                createProdInput();
                const newRows = prodList.querySelectorAll('.prod-row');
                const newLenInput = newRows[newRows.length - 1].querySelector('.input-len');
                inputClickHandler({ target: newLenInput });
            }
            return;
        }
        
        const allInputs = [totalInput, marginInput]; 
        const idx = allInputs.indexOf(focusedInput);
        if(idx !== -1 && idx < allInputs.length - 1) {
             inputClickHandler({target: allInputs[idx+1]});
        } else if (focusedInput === marginInput) {
             const firstLen = prodList.querySelector('.input-len');
             if(firstLen) inputClickHandler({target: firstLen});
        } else {
            removeFocus(focusedInput); focusedInput=null; softKeypad.style.display='none';
        }
        return;
    }

    if(key==='back'){
        focusedInput.value=val.slice(0,-1);
    }
    else if(key==='.'){
        if (event.target.classList.contains('disabled')) return;
        if(!val.includes('.')) focusedInput.value=val+'.';
    }
    else if(key>='0'&&key<='9'){
        if (focusedInput === totalInput || focusedInput === marginInput || focusedInput.classList.contains('input-margin')) {
             if(val.includes('.')){ const dec=val.split('.')[1]; if(dec && dec.length>=2) return; }
        }
        focusedInput.value=val+key;
    }
    
    if (focusedInput === marginInput) {
        updateMarginPlaceholders();
    }
});

document.addEventListener('click',(event)=>{
    const isInput = event.target.tagName === 'INPUT';
    const isInKeypad = event.target.closest('#softKeypad');
    const isInModal = event.target.closest('.custom-modal-overlay');
    const isInRecordItem = event.target.closest('.record-item');

    if (isInModal || isInRecordItem) return;

    if(!isInput && !isInKeypad && softKeypad.style.display === 'grid'){
        softKeypad.style.display='none';
        removeFocus(focusedInput); focusedInput=null;
    }
});


addBtn.addEventListener('click',()=>createProdInput());

resetBtn.addEventListener('click',(e)=>{
    e.preventDefault();
    showModal('초기화 확인','모든 입력값을 초기화하시겠습니까?\n(기록은 삭제되지 않습니다.)',true,(confirmed)=>{
        if(confirmed){
            totalInput.value='';
            marginInput.value='2';
            multiLengthInput.value = '';
            multiQtyInput.value = '';
            initializeProdInputs();
            updateMarginPlaceholders();
            previewCutsList.innerHTML='<div style="padding:15px; text-align:center; color:#ccc;">계산된 재단 목록이 없습니다.</div>';
            fsContainer.style.display='none';
        }
    });
});

function buildCutPlan(){
    softKeypad.style.display='none'; removeFocus(focusedInput); focusedInput=null;
    const total_m = parseFloat(totalInput.value);
    
    if(isNaN(total_m) || total_m <= 0){
        showModal('경고','총 원단 길이를 0보다 크게 입력해 주세요.',false);
        return false;
    }
    const total_mm = Math.round(total_m * 1000);
    const global_margin_perc = parseFloat(marginInput.value) || 0;
    
    const lens_mm=[];
    
    prodList.querySelectorAll('.prod-row').forEach((row)=>{
        const lenInput = row.querySelector('.input-len');
        const marginInputLocal = row.querySelector('.input-margin');
        
        const v_m = parseFloat(lenInput.value); 
        
        if(!isNaN(v_m) && v_m > 0){
            const len_mm = Math.round(v_m * 1000);
            
            let local_margin_val = marginInputLocal.value;
            let applied_margin_perc = global_margin_perc;
            
            if(local_margin_val !== '') {
                applied_margin_perc = parseFloat(local_margin_val);
                if(isNaN(applied_margin_perc)) applied_margin_perc = 0;
            }

            // ★★★ 수정된 계산 로직 (정수 올림) ★★★
            let percentage_result_mm = len_mm * (1 + applied_margin_perc / 100);
            let minimum_result_mm = len_mm + 1000;
            
            // 둘 중 큰 값을 선택하되, 무조건 m 단위로 올림 처리 (예: 52.53m -> 53m)
            // 이렇게 해야 914 - 53 = 861 처럼 딱 떨어지는 계산이 됨
            let raw_required_mm = Math.max(percentage_result_mm, minimum_result_mm);
            let required_mm = Math.ceil(raw_required_mm / 1000) * 1000; 
            
            lens_mm.push({len_mm, required_mm, v_m, applied_margin: applied_margin_perc});
        }
    });

    if(lens_mm.length===0){
        showModal('경고','유효한 제품 길이를 1개 이상 입력해 주세요.',false);
        return false;
    }

    cutPlan=[];
    let cumulative=0;
    for(let i=0;i<lens_mm.length;i++){
        const item = lens_mm[i];
        const required_mm = item.required_mm;
        cumulative+=required_mm;
        if(cumulative > total_mm){
            showModal('작업 중단 경고',`⛔ 작업 중단: 총 원단 길이를 초과했습니다!\n제품 ${i+1} (${item.v_m}m) 재단 시 총 원단 길이 (${total_m.toFixed(2)}m) 초과.`,false);
            break;
        }
        const remaining_mm=total_mm-cumulative;
        cutPlan.push({
            index:i+1,
            prodLen_m: (item.len_mm/1000),
            required_m:(required_mm/1000),
            cutPos:Math.floor(remaining_mm/1000),
            margin_used: item.applied_margin
        });
    }
    renderPreview();
    return true;
}

function renderPreview(){
    previewCutsList.innerHTML='';
    if(cutPlan.length===0){previewCutsList.innerHTML+='<div style="padding:15px;text-align:center;color:#ccc;">계산된 재단 목록이 없습니다.</div>'; return;}
    cutPlan.forEach(item=>{
        const row=document.createElement('div'); row.className='cut-row';
        row.innerHTML=`
            <div class="cut-left">
                <div class="prod-name">제품 ${item.index} (${item.prodLen_m}m) <span style="font-size:12px; color:#aaa;">[여유 ${item.margin_used}%]</span></div>
                <div class="prod-len">필요 길이: <b>${Math.round(item.required_m)}m</b></div>
            </div>
            <div class="cut-pos">${item.cutPos} m</div>`;
        previewCutsList.appendChild(row);
    });
}

function showFullscreen(){
    if (cutPlan.length === 0) {
        showModal('알림', '먼저 계산을 수행하여 재단 목록을 만드세요.', false);
        return;
    }
    const rows = prodList.querySelectorAll('.prod-row');
    let subText = '';
    let validProductsCount = 0;
    
    rows.forEach((row, idx) => {
        const lenInput = row.querySelector('.input-len');
        const value = lenInput.value.trim();
        if (value && parseFloat(value) > 0) {
            const label = `제품 ${idx + 1}`;
            const displayValue = Math.floor(parseFloat(value));
            subText += `<div>${label}: ${displayValue}m</div>`; 
            validProductsCount++;
        }
    });
    fsSummary.innerText = `제품 수량: ${validProductsCount}개`;
    const total_m = totalInput.value ? parseFloat(totalInput.value).toFixed(2) : 'N/A';
    
    const margin_perc = marginInput.value ? parseFloat(marginInput.value).toFixed(0) : 'N/A';
    fsInfo.innerText = `총 원단 길이: ${total_m} m\n기본 여유율: ${margin_perc}% (개별적용)`;
    fsSub.innerHTML = subText; 

    const fsCuts = document.getElementById('fsCuts');
    fsCuts.innerHTML = '';
    cutPlan.forEach(item => {
        const row = document.createElement('div'); row.className = 'cut-row';
        const label = `제품 ${item.index}`;
        
        row.innerHTML = `<div class="cut-left">
                            <div class="prod-name-row">
                                <div class="prod-name">${label}</div>
                                <div class="main-len">${item.prodLen_m} m</div>
                            </div>
                            <div class="required-len">(필요: <b>${Math.round(item.required_m)}m</b> / 여유 ${item.margin_used}%)</div>
                        </div>
                        <div class="cut-pos">${item.cutPos} m</div>`;
        fsCuts.appendChild(row);
    });
    
    fsContainer.style.display = 'flex';
    currentCutIndex = 0;
    renderFullscreenCut(0);
}

calcBtn.addEventListener('click', () => { if (buildCutPlan() && cutPlan.length > 0) { saveResult(); showFullscreen(); } });
fsBtn.addEventListener('click', showFullscreen);
exitBtn.addEventListener('click',()=>{fsContainer.style.display='none';});

function showModal(title,message,confirm=false,callback){
    passwordModalOverlay.style.display='none';
    softKeypad.style.display = 'none';
    modalTitle.innerText=title;
    modalMessage.innerText=message;
    modalConfirmBtn.style.display=confirm?'inline-block':'none';
    
    if (!confirm) {
        modalCancelBtn.innerText = '확인';
        modalCancelBtn.style.marginLeft = '0';
        modalCancelBtn.style.backgroundColor = '#3498db';
    } else {
        modalCancelBtn.innerText = '취소';
        modalCancelBtn.style.marginLeft = '10px';
        modalCancelBtn.style.backgroundColor = '#555';
    }

    customModalOverlay.style.display='flex';
    modalCallback=callback||null;
}
modalCancelBtn.addEventListener('click',()=>{ customModalOverlay.style.display='none'; if(modalCallback) modalCallback(false); });
modalConfirmBtn.addEventListener('click',()=>{ customModalOverlay.style.display='none'; if(modalCallback) modalCallback(true); });
function showPasswordModal(){
    customModalOverlay.style.display='none';
    passwordModalInput.value = '';
    passwordModalOverlay.style.display = 'flex';
    setTimeout(() => { passwordModalInput.click(); }, 50);
}
pwdCancelBtn.addEventListener('click', () => {
    passwordModalOverlay.style.display = 'none'; softKeypad.style.display = 'none';
    removeFocus(focusedInput); focusedInput = null; currentDeleteId = null;
});
pwdConfirmBtn.addEventListener('click', () => {
    softKeypad.style.display = 'none'; removeFocus(focusedInput); focusedInput = null;
    const inputPwd = passwordModalInput.value;
    if (inputPwd === DELETE_PASSWORD) {
        passwordModalOverlay.style.display = 'none'; processDelete();
    } else {
        passwordModalOverlay.style.display = 'none';
        showModal('경고', '비밀번호가 일치하지 않습니다.', false, () => { showPasswordModal(); });
    }
});

function renderFullscreenCut(index) {
    const allRows = document.querySelectorAll('#fsCuts .cut-row');
    allRows.forEach((row, idx) => {
        if (idx === index) {
            row.style.backgroundColor = '#4a4a75';
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            row.style.backgroundColor = '#2f2f50';
        }
    });
}
document.addEventListener('keydown', (e) => {
    if (fsContainer.style.display === 'flex' && cutPlan.length > 0) {
        e.preventDefault();
        if (['ArrowRight', ' ', 'ArrowDown'].includes(e.key)) { 
            currentCutIndex = (currentCutIndex + 1) % cutPlan.length;
            renderFullscreenCut(currentCutIndex);
        } else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { 
            currentCutIndex = (currentCutIndex - 1 + cutPlan.length) % cutPlan.length;
            renderFullscreenCut(currentCutIndex);
        } else if (e.key === 'Escape') {
             fsContainer.style.display='none';
        }
    }
});

addMultiBtn.addEventListener('click', () => {
    const length = parseInt(multiLengthInput.value);
    let quantity = parseInt(multiQtyInput.value);

    if (isNaN(length) || length <= 0) {
        showModal('입력 오류', '올바른 제품 길이를 입력하세요.', false);
        return;
    }
    if (isNaN(quantity) || quantity <= 0) {
        showModal('입력 오류', '올바른 수량을 입력하세요.', false);
        return;
    }

    const allRows = prodList.querySelectorAll('.prod-row');
    for (const row of allRows) {
        if (quantity === 0) break;
        const lenInput = row.querySelector('.input-len');
        if (lenInput.value.trim() === '') {
            lenInput.value = length;
            quantity--;
        }
    }

    for (let i = 0; i < quantity; i++) {
        createProdInput(length, ''); 
    }
    
    multiLengthInput.value = '';
    multiQtyInput.value = '';
    multiLengthInput.focus();
});

// 앱 시작 시 기록 불러오기 및 초기 세팅 (★ 핵심 수정)
renderRecords(getRecords());
updateMarginPlaceholders();

});
</script>
